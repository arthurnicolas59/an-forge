<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 390" width="1240" height="390" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Lancer un projet avec an-forge</title>
  <desc id="d">De gauche à droite : préparer le projet avec /project-init (skill setup-matt-pocock-skills), puis avec /project-launch : ton idée, l'interrogatoire (grill-with-docs), ton accord, la spec (to-spec), ton accord, et les tickets prêts à construire (to-tickets).</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#6d6a78"/>
    </marker>
  </defs>

  <rect width="1240" height="390" fill="#15141a"/>
  <rect x="20" y="20" width="1200" height="350" rx="14" fill="#0c0c0f" stroke="#c98a3e" stroke-width="1.5"/>
  <text x="48" y="62" fill="#eceaf2" font-size="24" font-weight="600">Lancer un projet</text>

  <g font-size="17" font-weight="600" text-anchor="middle">
    <rect x="75" y="130" width="170" height="72" rx="10" fill="#1b1a21" stroke="#3a3842"/>
    <text x="160" y="162" fill="#eceaf2">Préparer</text>
    <text x="160" y="184" fill="#a19fae" font-size="13" font-weight="400">le repo est prêt</text>

    <rect x="305" y="130" width="170" height="72" rx="10" fill="#1b1a21" stroke="#b18cff" stroke-width="2"/>
    <text x="390" y="162" fill="#eceaf2">Ton idée</text>
    <text x="390" y="184" fill="#a19fae" font-size="13" font-weight="400">tu la racontes</text>

    <rect x="535" y="130" width="170" height="72" rx="10" fill="#1b1a21" stroke="#3a3842"/>
    <text x="620" y="162" fill="#eceaf2">Interrogatoire</text>
    <text x="620" y="184" fill="#a19fae" font-size="13" font-weight="400">l'IA te questionne</text>

    <rect x="765" y="130" width="170" height="72" rx="10" fill="#1b1a21" stroke="#3a3842"/>
    <text x="850" y="162" fill="#eceaf2">Spec</text>
    <text x="850" y="184" fill="#a19fae" font-size="13" font-weight="400">le cahier des charges</text>

    <rect x="995" y="130" width="170" height="72" rx="10" fill="#1b1a21" stroke="#3a3842"/>
    <text x="1080" y="162" fill="#eceaf2">Tickets</text>
    <text x="1080" y="184" fill="#a19fae" font-size="13" font-weight="400">prêts à construire</text>
  </g>

  <g stroke="#6d6a78" stroke-width="2" marker-end="url(#a)">
    <line x1="249" y1="166" x2="299" y2="166"/>
    <line x1="479" y1="166" x2="529" y2="166"/>
    <line x1="709" y1="166" x2="759" y2="166"/>
    <line x1="939" y1="166" x2="989" y2="166"/>
  </g>

  <g font-size="12" text-anchor="middle" fill="#b18cff">
    <rect x="687" y="92" width="96" height="24" rx="12" fill="none" stroke="#b18cff" stroke-dasharray="4 3"/>
    <text x="735" y="108">ton accord</text>
    <rect x="917" y="92" width="96" height="24" rx="12" fill="none" stroke="#b18cff" stroke-dasharray="4 3"/>
    <text x="965" y="108">ton accord</text>
  </g>

  <g text-anchor="middle" font-size="12" fill="#79a3f2" font-family="Menlo, Consolas, monospace">
    <text x="160" y="226">setup-matt-pocock-skills</text>
    <text x="620" y="226">grill-with-docs</text>
    <text x="850" y="226">to-spec</text>
    <text x="1080" y="226">to-tickets</text>
  </g>

  <g stroke="#c98a3e" stroke-width="1.5" fill="none">
    <path d="M75 254 V262 H245 V254"/>
    <path d="M305 254 V262 H1165 V254"/>
  </g>
  <g text-anchor="middle">
    <text x="160" y="290" fill="#eceaf2" font-size="15" font-family="Menlo, Consolas, monospace">/project-init</text>
    <text x="160" y="312" fill="#a19fae" font-size="13">une fois par projet</text>
    <text x="735" y="290" fill="#eceaf2" font-size="15" font-family="Menlo, Consolas, monospace">/project-launch</text>
    <text x="735" y="312" fill="#a19fae" font-size="13">à chaque nouvelle idée</text>
  </g>
</svg>
