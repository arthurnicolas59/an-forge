<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="1240" height="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Traiter un ticket avec an-forge</title>
  <desc id="d">De gauche à droite, avec /build-ticket et sans s'arrêter : réserver le premier ticket libre (start-ticket.sh), construire en écrivant le test d'abord (tdd), tester avec les checks (gate.sh, jusqu'à 3 essais), faire relire par un agent neuf (code-review, 2 tours au plus), écrire le brief avec l'avant et l'après (before-after, feature-brief), ouvrir la pull request (pr). Puis, avec ton accord après lecture du brief, merger (merge-pr.sh).</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#6d6a78"/>
    </marker>
  </defs>

  <rect width="1240" height="400" fill="#15141a"/>
  <rect x="20" y="20" width="1200" height="360" rx="14" fill="#0c0c0f" stroke="#c98a3e" stroke-width="1.5"/>
  <text x="48" y="62" fill="#eceaf2" font-size="24" font-weight="600">Traiter un ticket</text>

  <g font-size="17" font-weight="600" text-anchor="middle">
    <rect x="53" y="160" width="138" height="72" rx="10" fill="#1b1a21" stroke="#3a3842"/>
    <text x="122" y="192" fill="#eceaf2">Ticket</text>
    <text x="122" y="214" fill="#a19fae" font-size="13" font-weight="400">le premier libre</text>

    <rect x="219" y="160" width="138" height="72" rx="10" fill="#1b1a21" stroke="#3a3842"/>
    <text x="288" y="192" fill="#eceaf2">Construire</text>
    <text x="288" y="214" fill="#a19fae" font-size="13" font-weight="400">le test d'abord</text>

    <rect x="385" y="160" width="138" height="72" rx="10" fill="#1b1a21" stroke="#3a3842"/>
    <text x="454" y="192" fill="#eceaf2">Tester</text>
    <text x="454" y="214" fill="#a19fae" font-size="13" font-weight="400">les checks passent</text>

    <rect x="551" y="160" width="138" height="72" rx="10" fill="#1b1a21" stroke="#3a3842"/>
    <text x="620" y="192" fill="#eceaf2">Relire</text>
    <text x="620" y="214" fill="#a19fae" font-size="13" font-weight="400">par un agent neuf</text>

    <rect x="717" y="160" width="138" height="72" rx="10" fill="#1b1a21" stroke="#3a3842"/>
    <text x="786" y="192" fill="#eceaf2">Brief</text>
    <text x="786" y="214" fill="#a19fae" font-size="13" font-weight="400">avant / après</text>

    <rect x="883" y="160" width="138" height="72" rx="10" fill="#1b1a21" stroke="#3a3842"/>
    <text x="952" y="192" fill="#eceaf2">PR</text>
    <text x="952" y="214" fill="#a19fae" font-size="13" font-weight="400">prête à lire</text>

    <rect x="1049" y="160" width="138" height="72" rx="10" fill="#1b1a21" stroke="#b18cff" stroke-width="2"/>
    <text x="1118" y="192" fill="#eceaf2">Merge</text>
    <text x="1118" y="214" fill="#a19fae" font-size="13" font-weight="400">puis le ménage</text>
  </g>

  <g stroke="#6d6a78" stroke-width="2" marker-end="url(#a)">
    <line x1="195" y1="196" x2="213" y2="196"/>
    <line x1="361" y1="196" x2="379" y2="196"/>
    <line x1="527" y1="196" x2="545" y2="196"/>
    <line x1="693" y1="196" x2="711" y2="196"/>
    <line x1="859" y1="196" x2="877" y2="196"/>
    <line x1="1025" y1="196" x2="1043" y2="196"/>
  </g>

  <g stroke="#6d6a78" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a)">
    <path d="M446 156 C446 120, 302 120, 302 154"/>
    <path d="M612 156 C612 84, 276 84, 276 154"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#a19fae" stroke="#0c0c0f" stroke-width="8" paint-order="stroke">
    <text x="374" y="131">si ça échoue · 3 essais</text>
    <text x="444" y="98">s'il y a à corriger · 2 tours</text>
  </g>

  <g font-size="12" text-anchor="middle" fill="#b18cff">
    <rect x="987" y="124" width="96" height="24" rx="12" fill="none" stroke="#b18cff" stroke-dasharray="4 3"/>
    <text x="1035" y="140">ton accord</text>
  </g>

  <g text-anchor="middle" font-size="12" fill="#79a3f2" font-family="Menlo, Consolas, monospace">
    <text x="122" y="256">start-ticket.sh</text>
    <text x="288" y="256">tdd</text>
    <text x="454" y="256">gate.sh</text>
    <text x="620" y="256">code-review</text>
    <text x="786" y="256">feature-brief</text>
    <text x="952" y="256">pr</text>
    <text x="1118" y="256">merge-pr.sh</text>
  </g>

  <g stroke="#c98a3e" stroke-width="1.5" fill="none">
    <path d="M53 284 V292 H1021 V284"/>
    <path d="M1049 284 V292 H1187 V284"/>
  </g>
  <g text-anchor="middle">
    <text x="537" y="320" fill="#eceaf2" font-size="15" font-family="Menlo, Consolas, monospace">/build-ticket</text>
    <text x="537" y="342" fill="#a19fae" font-size="13">sans s'arrêter, un ticket par session</text>
    <text x="1118" y="320" fill="#eceaf2" font-size="15">« merge la PR »</text>
    <text x="1118" y="342" fill="#a19fae" font-size="13">après lecture du brief</text>
  </g>
</svg>
