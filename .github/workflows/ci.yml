# Les contrôles d'an-forge lui-même, sur chaque pull request et chaque push sur main :
# les tests des scripts et les règles de version d'AGENTS.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tests des scripts
        run: bash tests/run.sh
      - name: Version
        if: github.event_name == 'pull_request'
        run: bash scripts/check-version.sh "origin/${{ github.base_ref }}"
