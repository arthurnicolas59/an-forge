<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>an-forge</title>
<style>
/* Le thème : toutes les couleurs et les polices sont ici. Change ces valeurs pour changer le design. */
:root {
  --bg-editor: #1f1f1f;
  --bg-sidebar: #181818;
  --bg-activity: #181818;
  --bg-tabs: #181818;
  --bg-hover: #2a2d2e;
  --bg-selected: #04395e;
  --bg-badge: #2b2b2b;
  --border: #2b2b2b;
  --fg: #cccccc;
  --fg-strong: #ffffff;
  --fg-muted: #9d9d9d;
  --fg-faint: #6e7681;
  --accent: #0078d4;
  --accent-fg: #4daafc;
  --statusbar: #0078d4;
  --statusbar-fg: #ffffff;
  --statusbar-offline: #c72e0f;
  --green: #73c991;
  --yellow: #cca700;
  --red: #f14c4c;
  --folder: #dcb67a;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg-editor); color: var(--fg); font: 13px/1.5 var(--font); display: grid; grid-template-rows: minmax(0, 1fr) 22px; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: var(--accent-fg); text-decoration: none; }
a:hover { text-decoration: underline; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.main { display: grid; grid-template-columns: 48px 260px minmax(0, 1fr); min-height: 0; }

.activity { background: var(--bg-activity); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; }
.activity button { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--fg-faint); position: relative; border-left: 2px solid transparent; }
.activity button svg.i { width: 24px; height: 24px; stroke-width: 1.4; }
.activity button:hover { color: var(--fg); }
.activity button.on { color: var(--fg-strong); border-left-color: var(--accent); }
.activity .count { position: absolute; right: 7px; bottom: 8px; background: var(--accent); color: #fff; font-size: 10px; line-height: 15px; min-width: 15px; padding: 0 4px; border-radius: 8px; }

.sidebar { background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.sidebar-head { height: 35px; display: flex; align-items: center; padding: 0 8px 0 20px; font-size: 11px; letter-spacing: .04em; color: var(--fg-muted); }
.sidebar-head button { margin-left: auto; color: var(--fg-muted); padding: 3px; border-radius: 4px; display: flex; }
.sidebar-head button:hover { background: var(--bg-hover); color: var(--fg); }
.sidebar-body { overflow-y: auto; flex: 1; padding-bottom: 12px; }
.row { display: flex; align-items: center; gap: 6px; height: 22px; padding-right: 10px; white-space: nowrap; cursor: pointer; border: 1px solid transparent; }
.row:hover { background: var(--bg-hover); }
.row.sel { background: var(--bg-selected); border-color: var(--accent); }
.row .lbl { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.row .meta { color: var(--fg-faint); font-size: 12px; }
.row .chev { width: 16px; color: var(--fg-muted); }
.row.dim .lbl { color: var(--fg-faint); }
.empty { color: var(--fg-muted); padding: 10px 20px; }

.editor { display: grid; grid-template-rows: 35px minmax(0, 1fr); min-width: 0; min-height: 0; }
.tabs { display: flex; background: var(--bg-tabs); border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab { display: flex; align-items: center; gap: 6px; padding: 0 8px 0 12px; border-right: 1px solid var(--border); color: var(--fg-muted); white-space: nowrap; cursor: pointer; border-top: 1px solid transparent; }
.tab.on { background: var(--bg-editor); color: var(--fg-strong); border-top-color: var(--accent); }
.tab .x { opacity: 0; display: flex; padding: 2px; border-radius: 4px; }
.tab:hover .x, .tab.on .x { opacity: 1; }
.tab .x:hover { background: var(--bg-hover); }
.content { overflow-y: auto; padding: 18px 28px 40px; }
.page { max-width: 820px; }
.crumb { font-family: var(--mono); font-size: 12px; color: var(--fg-faint); }
h1 { font-size: 20px; font-weight: 500; color: var(--fg-strong); margin: 6px 0 4px; }
h2 { font-size: 11px; font-weight: 500; letter-spacing: .05em; color: var(--fg-muted); margin: 26px 0 8px; text-transform: uppercase; }
.sub { color: var(--fg-muted); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--bg-badge); }
.prose { color: var(--fg); }
.prose p { margin: 0 0 8px; }
.prose ul { margin: 0 0 8px; padding-left: 20px; }
.prose code, code { font-family: var(--mono); font-size: 12px; background: var(--bg-badge); padding: 0 4px; border-radius: 3px; }
.prose strong { color: var(--fg-strong); font-weight: 500; }
.crit { display: grid; grid-template-columns: 18px 1fr; gap: 8px; padding: 4px 0; }
.crit svg.i { margin-top: 2px; }
.crit .proof { color: var(--fg-muted); font-size: 12px; }
.step { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); }
.step svg.i { margin-top: 2px; }
.step .name { color: var(--fg-strong); }
.step.todo .name { color: var(--fg-faint); }
.step .why { color: var(--fg-muted); font-size: 12px; }
.step .said { margin-top: 3px; }
.step .said .t { font-family: var(--mono); font-size: 11px; color: var(--fg-faint); margin-right: 6px; }
.step .time { font-family: var(--mono); font-size: 11px; color: var(--fg-faint); }
.note { color: var(--fg-muted); border-left: 2px solid var(--border); padding: 4px 12px; margin: 8px 0; }
.bar { height: 4px; border-radius: 2px; background: var(--border); margin: 10px 0 4px; max-width: 360px; overflow: hidden; }
.bar i { display: block; height: 4px; background: var(--green); }
.list .row { height: 28px; padding-left: 8px; border-radius: 4px; }
.feed { display: grid; grid-template-columns: 90px 1fr; gap: 4px 12px; }
.feed .t { font-family: var(--mono); font-size: 11px; color: var(--fg-faint); padding-top: 2px; }
.error { color: var(--red); }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1.6s linear infinite; }

.status { background: var(--statusbar); color: var(--statusbar-fg); display: flex; align-items: center; gap: 16px; padding: 0 10px; font-size: 12px; white-space: nowrap; overflow: hidden; }
.status.offline { background: var(--statusbar-offline); }
.status span { display: inline-flex; align-items: center; gap: 4px; }
.status svg.i { width: 14px; height: 14px; }
.status .right { margin-left: auto; display: flex; gap: 16px; }

@media (max-width: 760px) {
  .main { grid-template-columns: 48px minmax(0, 1fr); }
  .sidebar { display: none; }
  .main.show-side .sidebar { display: flex; position: fixed; left: 48px; top: 0; bottom: 22px; width: min(280px, calc(100vw - 48px)); z-index: 2; }
  .content { padding: 14px 16px 40px; }
}
</style>
</head>
<body>
<div class="main" id="main">
  <nav class="activity" id="activity"></nav>
  <aside class="sidebar">
    <div class="sidebar-head"><span id="side-title"></span><button id="refresh" title="Relire GitHub maintenant"></button></div>
    <div class="sidebar-body" id="side"></div>
  </aside>
  <section class="editor">
    <div class="tabs" id="tabs"></div>
    <div class="content" id="content"></div>
  </section>
</div>
<footer class="status" id="status"></footer>

<script>
// ---------- Icônes (traits simples, pas de dépendance) ----------
const ICONS = {
  files: '<path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/>',
  inbox: '<path d="M4 13h3l3 3h4l3-3h3"/><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>',
  activity: '<path d="M3 12h4l3 8 4-16 3 8h4"/>',
  folder: '<path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2"/>',
  spec: '<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/>',
  right: '<path d="M9 6l6 6-6 6"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  check: '<path d="M5 12l5 5L20 7"/>',
  circle: '<circle cx="12" cy="12" r="8"/>',
  dashed: '<path d="M8.6 4.8a8 8 0 0 1 6.8 0M19.2 8.6a8 8 0 0 1 0 6.8M15.4 19.2a8 8 0 0 1-6.8 0M4.8 15.4a8 8 0 0 1 0-6.8"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  alert: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  loader: '<path d="M12 3a9 9 0 1 0 9 9"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  refresh: '<path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"/>',
  link: '<path d="M12 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/><path d="M11 13l9-9M15 4h5v5"/>',
  branch: '<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10M18 9a6 6 0 0 1-6 6H6"/>',
  live: '<circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/>',
};
const icon = (name, color, cls = '') =>
  `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true"${color ? ` style="color:${color}"` : ''}>${ICONS[name]}</svg>`;

// ---------- Ce que veut dire chaque état et chaque étape ----------
const STATUS = {
  building:   { label: 'En construction', icon: 'loader', color: 'var(--accent-fg)', spin: true, order: 0 },
  stopped:    { label: 'Arrêté', icon: 'alert', color: 'var(--red)', order: 1 },
  review:     { label: 'À relire', icon: 'eye', color: 'var(--yellow)', order: 2 },
  ready:      { label: 'Prêt', icon: 'circle', color: 'var(--fg)', order: 3 },
  blocked:    { label: 'Bloqué', icon: 'lock', color: 'var(--fg-faint)', order: 4 },
  'not-ready':{ label: 'Pas prêt', icon: 'dashed', color: 'var(--fg-faint)', order: 5 },
  merged:     { label: 'Mergé', icon: 'check', color: 'var(--green)', order: 6 },
};
const STEPS = [
  ['isoler', 'Isoler', "Une copie de travail à part, sur sa propre branche. Le code principal (main) n'est pas touché pendant le travail."],
  ['avant', 'Avant', "L'état de départ : une capture de l'écran, ou la preuve du bug. Elle servira de comparaison à la fin."],
  ['construire', 'Construire', "D'abord un test qui décrit le résultat attendu, puis le code qui le fait passer. Une petite tranche à la fois."],
  ['tester', 'Tester', "Toutes les vérifications du projet : tests, lint, build. Rien n'avance tant qu'une seule échoue."],
  ['relire', 'Relire', "Deux agents neufs relisent le changement sans connaître le raisonnement : respecte-t-il le ticket et les règles du projet ?"],
  ['apres', 'Après', "L'état final, capturé au même endroit qu'au départ, pour montrer la différence."],
  ['brief', 'Brief', "Une page pour toi : ce qui change, pourquoi, l'avant et l'après, et à quel point c'est fiable."],
  ['pr', 'Pull request', "Le changement est proposé sur GitHub. Rien n'entre dans le code principal tant que tu ne l'as pas demandé."],
];
const STEP_NAME = Object.fromEntries(STEPS.map(([k, n]) => [k, n]));
STEP_NAME.arrete = 'Arrêté';
STEP_NAME.critere = 'Critère couvert';

// ---------- Outils ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`(.+?)`/g, '<code>$1</code>');
function markdown(text) {
  const out = [];
  let list = false;
  for (const line of String(text || '').split('\n')) {
    const li = line.match(/^\s*[-*]\s+(.*)$/);
    if (li) { if (!list) { out.push('<ul>'); list = true; } out.push(`<li>${inline(li[1])}</li>`); continue; }
    if (list) { out.push('</ul>'); list = false; }
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push('</ul>');
  return out.join('');
}
const fmtTime = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  const today = new Date().toDateString() === d.toDateString();
  return today
    ? d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
};
const since = (iso) => {
  const min = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60);
  return h < 48 ? `${h} h ${String(min % 60).padStart(2, '0')}` : `${Math.floor(h / 24)} jours`;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem('an-forge:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('an-forge:' + k, JSON.stringify(v)); } catch {} },
};

// ---------- État de la page ----------
let data = null;
let online = true;
let lastOk = null;
let view = store.get('view', 'explorer');
let tabs = store.get('tabs', []);
let active = store.get('active', null);
let collapsed = new Set(store.get('collapsed', []));
const save = () => { store.set('view', view); store.set('tabs', tabs); store.set('active', active); store.set('collapsed', [...collapsed]); };

const tabKey = (t) => t.type === 'ticket' ? `t:${t.project}:${t.number}` : `p:${t.project}`;
const findProject = (name) => data?.projects.find((p) => p.name === name);
const findTicket = (project, n) => findProject(project)?.tickets.find((t) => t.number === n);
const allTickets = () => (data?.projects || []).flatMap((p) => p.tickets.map((t) => ({ ...t, project: p.name })));

function open(tab) {
  const key = tabKey(tab);
  if (!tabs.some((t) => tabKey(t) === key)) tabs.push(tab);
  active = key;
  document.getElementById('main').classList.remove('show-side');
  save(); render();
}
function closeTab(key) {
  const i = tabs.findIndex((t) => tabKey(t) === key);
  if (i < 0) return;
  tabs.splice(i, 1);
  if (active === key) active = tabs.length ? tabKey(tabs[Math.min(i, tabs.length - 1)]) : null;
  save(); render();
}

// ---------- Barre d'activité ----------
function renderActivity() {
  const waiting = allTickets().filter((t) => t.status === 'review' || t.status === 'stopped').length;
  const items = [['explorer', 'files', 'Projets'], ['inbox', 'inbox', 'Pour toi'], ['feed', 'activity', 'Activité']];
  document.getElementById('activity').innerHTML = items.map(([k, ic, title]) =>
    `<button data-view="${k}" class="${view === k ? 'on' : ''}" title="${title}" aria-label="${title}">${icon(ic)}${k === 'inbox' && waiting ? `<span class="count">${waiting}</span>` : ''}</button>`
  ).join('');
}

// ---------- Barre latérale ----------
function ticketRow(t, project, depth) {
  const s = STATUS[t.status];
  const sel = active === `t:${project}:${t.number}`;
  const meta = t.status === 'building' && t.step ? STEP_NAME[t.step] : t.next ? 'Prochain' : '';
  return `<div class="row ${sel ? 'sel' : ''} ${t.status === 'merged' || t.status === 'blocked' || t.status === 'not-ready' ? 'dim' : ''}" style="padding-left:${depth * 14 + 22}px" data-open-ticket="${esc(project)}|${t.number}" title="${esc(s.label)}">
    ${icon(s.icon, s.color, s.spin ? 'spin' : '')}<span class="lbl">#${t.number} ${esc(t.title)}</span>${meta ? `<span class="meta">${esc(meta)}</span>` : ''}</div>`;
}
function renderExplorer() {
  if (!data) return '<div class="empty">Chargement…</div>';
  if (!data.projects.length) return `<div class="empty">Aucun projet pour l'instant. Lance <code>/dashboard</code> depuis un projet an-forge pour l'ajouter.</div>`;
  const out = [];
  for (const p of data.projects) {
    const key = `p:${p.name}`;
    const open = !collapsed.has(key);
    const done = p.tickets.filter((t) => t.status === 'merged').length;
    out.push(`<div class="row ${active === key ? 'sel' : ''}" style="padding-left:6px" data-toggle="${esc(key)}" data-open-project="${esc(p.name)}">
      <span class="chev">${icon(open ? 'down' : 'right')}</span>${icon('folder', 'var(--folder)')}<span class="lbl">${esc(p.name)}</span><span class="meta">${p.error ? '!' : `${done}/${p.tickets.length}`}</span></div>`);
    if (!open) continue;
    if (p.error) { out.push(`<div class="empty error" style="padding-left:40px">${esc(p.error)}</div>`); continue; }
    const bySpec = new Map();
    for (const t of p.tickets) {
      const k = t.spec && p.specs.some((s) => s.number === t.spec) ? t.spec : 0;
      if (!bySpec.has(k)) bySpec.set(k, []);
      bySpec.get(k).push(t);
    }
    for (const s of p.specs) {
      const list = bySpec.get(s.number) || [];
      const sk = `s:${p.name}:${s.number}`;
      const sopen = !collapsed.has(sk);
      out.push(`<div class="row ${s.open ? '' : 'dim'}" style="padding-left:20px" data-toggle="${esc(sk)}">
        <span class="chev">${icon(sopen ? 'down' : 'right')}</span>${icon('spec', 'var(--fg-muted)')}<span class="lbl">${esc(s.title)}</span></div>`);
      if (sopen) for (const t of list) out.push(ticketRow(t, p.name, 2));
    }
    for (const t of bySpec.get(0) || []) out.push(ticketRow(t, p.name, 1));
    if (!p.tickets.length) out.push('<div class="empty" style="padding-left:40px">Pas encore de ticket.</div>');
  }
  return out.join('');
}
function renderInboxSide() {
  const items = allTickets().filter((t) => t.status === 'review' || t.status === 'stopped');
  if (!items.length) return '<div class="empty">Rien ne t\'attend.</div>';
  return items.map((t) => {
    const s = STATUS[t.status];
    return `<div class="row" style="padding-left:14px;height:auto;padding-top:6px;padding-bottom:6px;align-items:flex-start" data-open-ticket="${esc(t.project)}|${t.number}">
      ${icon(s.icon, s.color)}<span class="lbl" style="white-space:normal">${esc(t.project)} #${t.number} ${esc(t.title)}<br><span style="color:var(--fg-muted);font-size:12px">${t.status === 'review' ? 'PR prête : lis le brief' : 'Arrêté : ' + esc(lastStep(t)?.message || '')}</span></span></div>`;
  }).join('');
}
const lastStep = (t) => [...t.journal].reverse().find((e) => e.step !== 'critere');
function feedEntries(limit) {
  return allTickets().flatMap((t) => t.journal.map((e) => ({ ...e, title: t.title, project: t.project })))
    .sort((a, b) => b.time.localeCompare(a.time)).slice(0, limit);
}
function renderFeedSide() {
  const items = feedEntries(40);
  if (!items.length) return '<div class="empty">Aucune étape notée pour l\'instant. Le journal se remplit pendant <code>/build-ticket</code>.</div>';
  return items.map((e) => `<div class="row" style="padding-left:14px;height:auto;padding-top:5px;padding-bottom:5px;align-items:flex-start" data-open-ticket="${esc(e.project)}|${e.ticket}">
    <span class="lbl" style="white-space:normal"><span style="color:var(--fg-faint);font-family:var(--mono);font-size:11px">${fmtTime(e.time)}</span> ${esc(e.project)} #${e.ticket} · ${esc(STEP_NAME[e.step] || e.step)}<br><span style="color:var(--fg-muted);font-size:12px">${esc(e.message)}</span></span></div>`).join('');
}
function renderSide() {
  const titles = { explorer: 'PROJETS', inbox: 'POUR TOI', feed: 'ACTIVITÉ' };
  document.getElementById('side-title').textContent = titles[view];
  document.getElementById('refresh').innerHTML = icon('refresh');
  document.getElementById('side').innerHTML = view === 'inbox' ? renderInboxSide() : view === 'feed' ? renderFeedSide() : renderExplorer();
}

// ---------- Onglets ----------
function tabTitle(t) {
  if (t.type === 'project') return { ic: icon('folder', 'var(--folder)'), text: t.project };
  const tk = findTicket(t.project, t.number);
  const s = tk ? STATUS[tk.status] : null;
  return { ic: s ? icon(s.icon, s.color, s.spin ? 'spin' : '') : icon('circle'), text: `#${t.number} ${tk ? tk.title : ''}` };
}
function renderTabs() {
  document.getElementById('tabs').innerHTML = tabs.map((t) => {
    const k = tabKey(t);
    const { ic, text } = tabTitle(t);
    return `<div class="tab ${active === k ? 'on' : ''}" data-tab="${esc(k)}">${ic}<span>${esc(text.length > 34 ? text.slice(0, 33) + '…' : text)}</span><button class="x" data-close="${esc(k)}" aria-label="Fermer">${icon('x')}</button></div>`;
  }).join('');
}

// ---------- Contenu : un projet ----------
function renderProject(p) {
  if (!p) return '<div class="page"><p class="note">Ce projet n\'est plus dans la liste.</p></div>';
  if (p.error) return `<div class="page"><h1>${esc(p.name)}</h1><p class="note error">${esc(p.error)}</p></div>`;
  const total = p.tickets.length;
  const done = p.tickets.filter((t) => t.status === 'merged').length;
  const count = (st) => p.tickets.filter((t) => t.status === st).length;
  const sorted = [...p.tickets].sort((a, b) => (STATUS[a.status].order - STATUS[b.status].order) || (b.next ? 1 : 0) - (a.next ? 1 : 0) || a.number - b.number);
  const summary = [['building', 'en construction'], ['review', 'à relire'], ['stopped', 'arrêté'], ['ready', 'prêt'], ['blocked', 'bloqué']]
    .filter(([s]) => count(s)).map(([s, l]) => `<span class="badge">${icon(STATUS[s].icon, STATUS[s].color)}${count(s)} ${l}${count(s) > 1 && !l.includes(' ') ? 's' : ''}</span>`).join('');
  return `<div class="page">
    <div class="crumb">${esc(p.path)}</div>
    <h1>${esc(p.name)}</h1>
    <div class="sub">${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.repo)} ${icon('link')}</a>` : ''}</div>
    <div class="bar"><i style="width:${total ? Math.round(done / total * 100) : 0}%"></i></div>
    <div class="sub">${done} ticket${done > 1 ? 's' : ''} mergé${done > 1 ? 's' : ''} sur ${total}</div>
    <div class="sub" style="margin-top:10px">${summary}</div>
    ${p.specs.map((s) => `<h2>${s.open ? 'Spec en cours' : 'Spec terminée'}</h2><div><a href="${esc(s.url)}" target="_blank" rel="noopener">#${s.number} ${esc(s.title)}</a></div>`).join('')}
    <h2>Les tickets</h2>
    <div class="list">${sorted.map((t) => {
      const s = STATUS[t.status];
      const why = t.status === 'blocked' ? `attend ${t.blockers.filter((b) => b.open).map((b) => '#' + b.number).join(', ')}`
        : t.status === 'building' && t.step ? `étape ${STEP_NAME[t.step]}` : t.next ? 'le prochain' : '';
      return `<div class="row" data-open-ticket="${esc(p.name)}|${t.number}">${icon(s.icon, s.color, s.spin ? 'spin' : '')}<span class="lbl">#${t.number} ${esc(t.title)}</span><span class="meta">${esc(s.label)}${why ? ' · ' + esc(why) : ''}</span></div>`;
    }).join('')}</div>
  </div>`;
}

// ---------- Contenu : un ticket ----------
function renderTicket(projectName, t) {
  if (!t) return '<div class="page"><p class="note">Ce ticket n\'est plus dans la liste.</p></div>';
  const p = findProject(projectName);
  const s = STATUS[t.status];
  const spec = p.specs.find((x) => x.number === t.spec);
  const steps = t.journal.filter((e) => e.step !== 'critere');
  const reached = new Set(steps.map((e) => e.step));
  const current = steps.length ? steps[steps.length - 1].step : null;
  const stopped = t.status === 'stopped';
  const finished = t.status === 'merged' || t.status === 'review';
  const lastIdx = STEPS.findIndex(([k]) => k === (stopped ? [...steps].reverse().find((e) => e.step !== 'arrete')?.step : current));

  let sub = `<span class="badge">${icon(s.icon, s.color, s.spin ? 'spin' : '')}${esc(s.label)}${t.status === 'building' && current ? ' · ' + esc(STEP_NAME[current]) : ''}</span>`;
  if (t.status === 'building' && steps.length) sub += `<span>depuis ${since(steps[0].time)}</span>`;
  sub += `<a href="${esc(t.url)}" target="_blank" rel="noopener">Ticket ${icon('link')}</a>`;
  if (t.pr) sub += `<a href="${esc(t.pr.url)}" target="_blank" rel="noopener">Pull request #${t.pr.number} ${icon('link')}</a>`;

  const criteria = t.criteria.length
    ? t.criteria.map((c) => `<div class="crit">${c.done ? icon('check', 'var(--green)') : icon('circle', 'var(--fg-faint)')}<div><div style="${c.done ? '' : 'color:var(--fg-muted)'}">${inline(c.text)}</div>${c.proof ? `<div class="proof">${esc(c.proof)}</div>` : ''}</div></div>`).join('')
    : '<p class="note">Ce ticket n\'a pas de liste de critères d\'acceptation.</p>';

  const blockers = t.blockers.length
    ? `<h2>Dépend de</h2>${t.blockers.map((b) => { const bt = p.tickets.find((x) => x.number === b.number); return `<div class="row" data-open-ticket="${esc(projectName)}|${b.number}" style="padding-left:4px">${b.open ? icon('lock', 'var(--fg-faint)') : icon('check', 'var(--green)')}<span class="lbl">#${b.number} ${esc(bt ? bt.title : '')}</span><span class="meta">${b.open ? 'pas encore fait' : 'fait'}</span></div>`; }).join('')}`
    : '';

  let flow;
  if (!steps.length && t.status === 'merged') {
    flow = '<p class="note">Pas de journal pour ce ticket : il a été construit avant que /build-ticket ne note ses étapes.</p>';
  } else if (!steps.length) {
    flow = `<p class="note">${t.status === 'blocked' ? 'Ce ticket attend qu\'un autre soit terminé.' : 'Pas encore commencé.'} Voici les étapes que suivra <code>/build-ticket</code> :</p>`
      + STEPS.map(([, name, why]) => `<div class="step todo">${icon('circle', 'var(--fg-faint)')}<div><div class="name">${name}</div><div class="why">${why}</div></div><span></span></div>`).join('');
  } else {
    flow = STEPS.map(([key, name, why], i) => {
      const entries = steps.filter((e) => e.step === key);
      let ic;
      if (finished || (reached.has(key) && i < lastIdx)) ic = icon('check', 'var(--green)');
      else if (i === lastIdx && stopped) ic = icon('alert', 'var(--red)');
      else if (i === lastIdx) ic = icon('loader', 'var(--accent-fg)', 'spin');
      else ic = icon('circle', 'var(--fg-faint)');
      const todo = !reached.has(key) && !finished;
      const said = entries.map((e) => `<div class="said">${entries.length > 1 ? `<span class="t">${fmtTime(e.time)}</span>` : ''}${esc(e.message)}</div>`).join('');
      return `<div class="step ${todo ? 'todo' : ''}">${ic}<div><div class="name">${name}</div><div class="why">${why}</div>${said}</div><span class="time">${entries.length ? fmtTime(entries[0].time) : ''}</span></div>`;
    }).join('');
    if (stopped) {
      const stop = [...steps].reverse().find((e) => e.step === 'arrete');
      flow += `<div class="step">${icon('alert', 'var(--red)')}<div><div class="name" style="color:var(--red)">Arrêté</div><div class="said">${esc(stop.message)}</div><div class="why">Relance <code>/build-ticket ${t.number}</code> pour reprendre là où il s'est arrêté.</div></div><span class="time">${fmtTime(stop.time)}</span></div>`;
    }
  }
  if (t.status === 'merged') flow += `<div class="step">${icon('check', 'var(--green)')}<div><div class="name">Mergé</div><div class="why">Le changement est dans le code principal.</div></div><span class="time">${fmtTime(t.closedAt)}</span></div>`;
  if (t.status === 'review') flow += `<div class="step">${icon('eye', 'var(--yellow)')}<div><div class="name">À toi</div><div class="why">Lis le brief. S'il te convient, dis « merge la PR » à Claude.</div></div><span></span></div>`;

  return `<div class="page">
    <div class="crumb">${esc(projectName)}${spec ? ` › spec #${spec.number}` : ''} › #${t.number}</div>
    <h1>${esc(t.title)}</h1>
    <div class="sub">${sub}</div>
    ${t.what ? `<h2>Ce qu'il faut construire</h2><div class="prose">${markdown(t.what)}</div>` : ''}
    <h2>Ce qui va être fait</h2>${criteria}
    ${blockers}
    <h2>Déroulé</h2>${flow}
  </div>`;
}

function renderWelcome() {
  const n = data?.projects.length || 0;
  return `<div class="page" style="padding-top:40px">
    <h1>an-forge</h1>
    <p class="sub">${n ? `Choisis un projet ou un ticket dans l'explorateur, à gauche.` : `Aucun projet suivi pour l'instant.`}</p>
    ${n ? '' : `<p class="note">Un projet apparaît ici quand tu lances <code>/dashboard</code> ou <code>/build-ticket</code> dedans.</p>`}
  </div>`;
}

function renderContent() {
  const el = document.getElementById('content');
  const tab = tabs.find((t) => tabKey(t) === active);
  if (!data) { el.innerHTML = '<div class="empty">Chargement…</div>'; return; }
  el.innerHTML = !tab ? renderWelcome()
    : tab.type === 'project' ? renderProject(findProject(tab.project))
    : renderTicket(tab.project, findTicket(tab.project, tab.number));
}

// ---------- Barre d'état ----------
function renderStatus() {
  const all = allTickets();
  const building = all.filter((t) => t.status === 'building').length;
  const review = all.filter((t) => t.status === 'review').length;
  const tab = tabs.find((t) => tabKey(t) === active);
  const branch = tab?.type === 'ticket' ? [...(findTicket(tab.project, tab.number)?.journal || [])].reverse().find((e) => e.branch)?.branch : null;
  const el = document.getElementById('status');
  el.classList.toggle('offline', !online);
  el.innerHTML = `${branch ? `<span>${icon('branch')}${esc(branch)}</span>` : ''}
    <span>${data ? data.projects.length : 0} projet${data && data.projects.length > 1 ? 's' : ''}</span>
    <span>${building} en construction</span><span>${review} à relire</span>
    <span class="right"><span>${lastOk ? 'Mis à jour ' + lastOk.toLocaleTimeString('fr-FR') : ''}</span><span>${icon('live')}${online ? 'En direct' : 'Hors ligne : le serveur ne répond pas'}</span></span>`;
}

function render() { renderActivity(); renderSide(); renderTabs(); renderContent(); renderStatus(); }

// ---------- Clics ----------
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-close],[data-tab],[data-open-ticket],[data-open-project],[data-toggle],[data-view],#refresh');
  if (!el) return;
  if (el.id === 'refresh') return load(true);
  if (el.dataset.close) { ev.stopPropagation(); return closeTab(el.dataset.close); }
  if (el.dataset.tab) { active = el.dataset.tab; save(); return render(); }
  if (el.dataset.view) {
    const m = document.getElementById('main');
    if (view === el.dataset.view) m.classList.toggle('show-side'); else m.classList.add('show-side');
    view = el.dataset.view; save(); return render();
  }
  if (el.dataset.openTicket) {
    const [project, n] = el.dataset.openTicket.split('|');
    return open({ type: 'ticket', project, number: Number(n) });
  }
  if (el.dataset.toggle) {
    const k = el.dataset.toggle;
    const onChevron = ev.target.closest('.chev');
    if (el.dataset.openProject && !onChevron) { collapsed.delete(k); return open({ type: 'project', project: el.dataset.openProject }); }
    if (collapsed.has(k)) collapsed.delete(k); else collapsed.add(k);
    save(); return render();
  }
});

// ---------- Données ----------
async function load(refresh = false) {
  try {
    const r = await fetch('/api/state' + (refresh ? '?refresh=1' : ''), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    online = true;
    lastOk = new Date();
  } catch {
    online = false;
  }
  render();
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
